<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rezio Booking Management — Date Picker</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    height: 100vh;
    background: #ffffff;
    font-family: "Noto Sans", system-ui, sans-serif;
    color: #1f2328;
  }

  /* ===================================================================
     APP SHELL (desktop rezio web admin) — wraps the calendar.
     The source file centered .dp-card on the body; here the shell
     controls layout, so the card sits inside the content area.
  =================================================================== */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100%;
  }

  /* ---------- Top bar (PRIMARY BLUE) ---------- */
  .app-topbar {
    flex-shrink: 0;
    background: #005abe;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 16px;
    height: 52px;
  }
  .app-topbar svg { display: block; }

  .tb-logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .tb-logo .wordmark {
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: #ffffff;
    line-height: 1;
  }
  .tb-logo .product { font-weight: 700; font-size: 18px; color: #ffffff; line-height: 1; }

  .tb-left { flex: 1; display: flex; align-items: center; gap: 16px; min-width: 0; }
  .tb-right { flex: 1; display: flex; align-items: center; gap: 16px; justify-content: flex-end; }

  .tb-company { display: inline-flex; align-items: center; gap: 8px; }
  .tb-super {
    background: #0977f5;
    color: #ffffff;
    font-weight: 700;
    font-size: 14px;
    line-height: 1;
    border-radius: 4px;
    padding: 2px 6px;
  }
  .tb-company-name { font-size: 16px; font-weight: 700; color: #ffffff; }
  .tb-caret { font-size: 16px; color: #ffffff; line-height: 1; }

  .tb-action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
  }
  .tb-ico {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #ffffff;
  }
  .tb-ico svg { width: 16px; height: 16px; }
  .tb-bell-badge {
    position: absolute;
    top: -8px;
    left: 9px;
    background: #c80a28;
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    border-radius: 2px;
    padding: 2px 3px;
    white-space: nowrap;
  }

  /* ---------- Body row: sidebar | content ---------- */
  .app-body {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* ---------- Left menu ---------- */
  .app-sidebar {
    width: 250px;
    flex-shrink: 0;
    background: #f4f4f4;
    padding: 24px 16px 24px 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .sidebar-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 0 8px;
    color: #005abe;
  }
  .sidebar-head svg { width: 24px; height: 24px; color: #005abe; }
  .sidebar-head span { font-size: 18px; font-weight: 700; color: #005abe; }

  .nav-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 4px 8px 8px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .nav-row:hover { background: rgba(0, 0, 0, 0.04); }
  .nav-row .nav-ico {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #7b7b7b;
  }
  .nav-row .nav-ico svg { width: 24px; height: 24px; display: block; }
  .nav-row .nav-label { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; color: #7b7b7b; }
  .nav-row .nav-chev { color: #7b7b7b; font-size: 24px; line-height: 1; }

  .nav-divider { height: 1px; background: #e0e0e0; margin: 4px 0; }

  .nav-row.active { background: #eaf0f8; }
  .nav-row.active .nav-ico { color: #005abe; }
  .nav-row.active .nav-label { color: #005abe; }
  .nav-row.active .nav-chev { color: #005abe; }

  .nav-sub {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 8px 4px 8px 44px;
    font-size: 16px;
    font-weight: 700;
    color: #7b7b7b;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .nav-sub:hover { background: rgba(0, 0, 0, 0.04); }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 24px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: #7b7b7b;
    line-height: 1.8;
  }

  /* ---------- Content area ---------- */
  .app-content {
    flex: 1;
    min-width: 0;
    background: #ffffff;
    overflow: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 24px 40px;
  }
  .content-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .field-label {
    font-size: 13px;
    color: #7b7b7b;
    padding-left: 2px;
  }
  .date-input { display: flex; align-items: center; gap: 8px; width: 320px; max-width: 100%; height: 44px; padding: 0 12px; border: 1px solid #dcdcdc; border-radius: 8px; background: #ffffff; cursor: pointer; font: inherit; }
  .date-input:hover { border-color: #005abe; }
  .date-input-text { font-size: 14px; color: #9aa0a6; }
  .date-input-text.filled { color: #1f2328; }
  .dp-overlay { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(15, 23, 42, 0.5); }
  .dp-overlay.open { display: flex; }

  /* ===================================================================
     CALENDAR — VERBATIM from date-picker-prototype.html
     (only the source <body> centering rules are omitted; the shell
      above positions the card. All calendar rules below are unchanged.)
  =================================================================== */

  .dp-card {
    width: 300px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    overflow: hidden;
    position: relative;
  }

  button { font-family: inherit; cursor: pointer; }

  /* ---------- Header (blue bar) ---------- */
  .dp-header {
    background: #005abe;
    color: #ffffff;
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 4px;
  }
  .dp-header > .dp-close { justify-self: start; }
  .dp-header > .dp-today { justify-self: end; }
  .dp-hbtn {
    background: transparent;
    border: none;
    color: #ffffff;
    padding: 0;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    transition: background 0.12s ease;
  }
  .dp-hbtn:hover { background: rgba(255, 255, 255, 0.18); }
  .dp-hbtn:focus-visible { outline: 2px solid #ffffff; outline-offset: 1px; }

  .dp-close { font-size: 20px; width: 24px; height: 24px; }
  .dp-header-center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .dp-chev { font-size: 18px; width: 24px; height: 24px; }
  .dp-year-btn {
    background: transparent;
    border: none;
    color: #ffffff;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px 4px;
    border-radius: 4px;
    line-height: 1;
    transition: background 0.12s ease;
  }
  .dp-year-btn:hover { background: rgba(255, 255, 255, 0.18); }
  .dp-year-btn:focus-visible { outline: 2px solid #ffffff; outline-offset: 1px; }
  .dp-caret { font-size: 13px; transition: transform 0.15s ease; }
  .dp-year-btn[aria-expanded="true"] .dp-caret,
  .dp-month-btn[aria-expanded="true"] .dp-caret { transform: rotate(180deg); }
  .dp-today {
    background: transparent;
    border: none;
    color: #ffffff;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 6px;
    border-radius: 4px;
    white-space: nowrap;
    transition: background 0.12s ease;
  }
  .dp-today:hover { background: rgba(255, 255, 255, 0.18); }
  .dp-today:focus-visible { outline: 2px solid #ffffff; outline-offset: 1px; }

  /* ---------- Month bar ---------- */
  .dp-monthbar {
    background: #ffffff;
    padding: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .dp-mchev {
    background: transparent;
    border: none;
    color: #005abe;
    font-size: 18px;
    width: 28px;
    height: 28px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    transition: background 0.12s ease;
  }
  .dp-mchev:hover { background: #f0f4fa; }
  .dp-mchev:focus-visible { outline: 2px solid #005abe; outline-offset: 1px; }
  .dp-month-center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dp-month-btn {
    background: transparent;
    border: none;
    color: #005abe;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
    transition: background 0.12s ease;
  }
  .dp-month-btn:hover { background: #f0f4fa; }
  .dp-month-btn:focus-visible { outline: 2px solid #005abe; outline-offset: 1px; }

  /* ---------- Week header ---------- */
  .dp-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 0 6px;
  }
  .dp-week .dp-wk {
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #000000;
  }

  /* ---------- Date grid ---------- */
  .dp-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 0 6px 6px;
  }
  .dp-cell {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .dp-day {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    font-size: 14px;
    color: #1f2328;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    padding: 0;
    position: relative;
    transition: background 0.12s ease;
  }
  /* hover only on in-month, non-selected days */
  .dp-day.in:not(.selected):hover { background: #f0f4fa; }
  .dp-day:focus-visible {
    outline: 2px solid #005abe;
    outline-offset: -2px;
    border-radius: 50%;
  }
  .dp-day.out { color: #dcdcdc; cursor: default; }
  /* today: blue ring outline */
  .dp-day.in.today:not(.selected) { box-shadow: inset 0 0 0 1.5px #005abe; color: #005abe; }
  /* selected: filled solid-blue circle */
  .dp-day.selected { background: #005abe; color: #ffffff; font-weight: 600; }

  /* ---------- Footer ---------- */
  .dp-footer {
    border-top: 1px solid #dcdcdc;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .dp-selinfo { display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0; height: 38px; }
  .dp-sel-label { font-size: 12px; color: #000000; }
  .dp-sel-value { font-size: 14px; color: #1f2328; }
  .dp-sel-empty { font-size: 12px; color: #7b7b7b; }
  .dp-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .dp-action {
    background: transparent;
    border: none;
    font-size: 14px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 4px;
    color: #005abe;
    transition: background 0.12s ease;
  }
  .dp-action:disabled { color: #b0b0b0; cursor: default; }
  .dp-action:not(:disabled):hover { background: #f0f4fa; }
  .dp-action:focus-visible { outline: 2px solid #005abe; outline-offset: 1px; }

  /* ---------- Popover (year / month pickers) ---------- */
  .dp-pop {
    position: absolute;
    left: 12px;
    right: 12px;
    background: #ffffff;
    border: 1px solid #dcdcdc;
    border-radius: 8px;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    padding: 8px;
    z-index: 10;
    display: none;
  }
  .dp-pop.open { display: block; }
  /* anchor each popover just beneath its trigger control */
  #yearPop { top: 48px; }   /* below the blue header */
  #monthPop { top: 92px; }  /* below the month bar */
  .dp-pop-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  .dp-pop-item {
    background: transparent;
    border: none;
    font-size: 13px;
    color: #1f2328;
    padding: 8px 0;
    border-radius: 4px;
    transition: background 0.12s ease;
  }
  .dp-pop-item:hover { background: #f0f4fa; }
  .dp-pop-item:focus-visible { outline: 2px solid #005abe; outline-offset: -2px; }
  .dp-pop-item.active {
    color: #005abe;
    font-weight: 600;
    background: #eaf0f8;
  }
</style>
</head>
<body>
  <div class="app">

    <!-- ===================== TOP BAR ===================== -->
    <header class="app-topbar">
    </header>

    <!-- ===================== BODY ROW ===================== -->
    <div class="app-body">

      <main class="app-content">
        <div class="content-stack">
          <span class="field-label">Booking date</span>
          <button class="date-input" id="dateInput" type="button">
            <svg class="date-input-glyph" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <rect x="2" y="3.5" width="16" height="14" rx="2" stroke="#005abe" stroke-width="1.5"/>
              <path d="M2 7.5h16" stroke="#005abe" stroke-width="1.5"/>
              <path d="M6 1.5v3M14 1.5v3" stroke="#005abe" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="date-input-text" id="dateInputText">Select a date</span>
          </button>

          <!-- ===== VERBATIM calendar markup, now inside a dimmed modal overlay ===== -->
          <div class="dp-overlay open" id="dpOverlay">
          <div class="dp-card" role="application" aria-label="Date picker">

            <div class="dp-header">
              <button class="dp-hbtn dp-close" type="button" aria-label="Close date picker">&times;</button>
              <div class="dp-header-center">
                <button class="dp-hbtn dp-chev" id="prevYear" type="button" aria-label="Previous year">&lsaquo;</button>
                <button class="dp-year-btn" id="yearBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="yearPop" aria-label="Select year">
                  <span id="yearLabel">2026</span><span class="dp-caret" aria-hidden="true">&#9662;</span>
                </button>
                <button class="dp-hbtn dp-chev" id="nextYear" type="button" aria-label="Next year">&rsaquo;</button>
              </div>
              <button class="dp-today" id="todayBtn" type="button">Today</button>
            </div>

            <div class="dp-monthbar">
              <button class="dp-mchev" id="prevMonth" type="button" aria-label="Previous month">&lsaquo;</button>
              <div class="dp-month-center">
                <button class="dp-month-btn" id="monthBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="monthPop" aria-label="Select month">
                  <span id="monthLabel">October</span><span class="dp-caret" aria-hidden="true">&#9662;</span>
                </button>
              </div>
              <button class="dp-mchev" id="nextMonth" type="button" aria-label="Next month">&rsaquo;</button>
            </div>

            <div class="dp-week" role="row">
              <span class="dp-wk" role="columnheader" aria-label="Monday">Mon</span>
              <span class="dp-wk" role="columnheader" aria-label="Tuesday">Tue</span>
              <span class="dp-wk" role="columnheader" aria-label="Wednesday">Wed</span>
              <span class="dp-wk" role="columnheader" aria-label="Thursday">Thu</span>
              <span class="dp-wk" role="columnheader" aria-label="Friday">Fri</span>
              <span class="dp-wk" role="columnheader" aria-label="Saturday">Sat</span>
              <span class="dp-wk" role="columnheader" aria-label="Sunday">Sun</span>
            </div>

            <div class="dp-grid" id="grid" role="grid" aria-label="Calendar dates"></div>

            <div class="dp-footer">
              <div class="dp-selinfo" id="selInfo"></div>
              <div class="dp-actions">
                <button class="dp-action" id="clearBtn" type="button" disabled>Clear</button>
                <button class="dp-action" id="confirmBtn" type="button" disabled>Confirm</button>
              </div>
            </div>

            <div class="dp-pop" id="yearPop" role="dialog" aria-label="Year picker" aria-modal="false">
              <div class="dp-pop-grid" id="yearGrid"></div>
            </div>
            <div class="dp-pop" id="monthPop" role="dialog" aria-label="Month picker" aria-modal="false">
              <div class="dp-pop-grid" id="monthGrid"></div>
            </div>

          </div>
          </div>
          <!-- ===== end calendar markup ===== -->
        </div>
      </main>

    </div>
  </div>

<script>
(function () {
  "use strict";

  var MONTHS = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];

  var now = new Date();
  var todayY = now.getFullYear();
  var todayM = now.getMonth();
  var todayD = now.getDate();

  var viewY = todayY;
  var viewM = todayM;

  var selY = null, selM = null, selD = null;
  var confirmTimer = null;

  // Index (0..41) of the date cell that currently holds roving focus.
  var activeCell = null;

  var el = {
    card: document.querySelector(".dp-card"),
    yearLabel: document.getElementById("yearLabel"),
    monthLabel: document.getElementById("monthLabel"),
    grid: document.getElementById("grid"),
    selInfo: document.getElementById("selInfo"),
    clearBtn: document.getElementById("clearBtn"),
    confirmBtn: document.getElementById("confirmBtn"),
    yearBtn: document.getElementById("yearBtn"),
    monthBtn: document.getElementById("monthBtn"),
    yearPop: document.getElementById("yearPop"),
    monthPop: document.getElementById("monthPop"),
    yearGrid: document.getElementById("yearGrid"),
    monthGrid: document.getElementById("monthGrid")
  };

  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

  // Monday-first index (0 = Mon ... 6 = Sun) of the 1st of the month
  function firstWeekdayMon(y, m) {
    var js = new Date(y, m, 1).getDay(); // 0 = Sun ... 6 = Sat
    return (js + 6) % 7;
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function isSelected(y, m, d) { return selY === y && selM === m && selD === d; }
  function isToday(y, m, d) { return y === todayY && m === todayM && d === todayD; }

  function renderHeader() {
    el.yearLabel.textContent = viewY;
    el.monthLabel.textContent = MONTHS[viewM];
  }

  // Build the 42-cell model for the current view.
  function buildCells() {
    var lead = firstWeekdayMon(viewY, viewM);
    var dim = daysInMonth(viewY, viewM);
    var prevM = viewM === 0 ? 11 : viewM - 1;
    var prevY = viewM === 0 ? viewY - 1 : viewY;
    var dimPrev = daysInMonth(prevY, prevM);

    var cells = [];
    for (var i = lead - 1; i >= 0; i--) {
      cells.push({ y: prevY, m: prevM, d: dimPrev - i, inMonth: false });
    }
    for (var d = 1; d <= dim; d++) {
      cells.push({ y: viewY, m: viewM, d: d, inMonth: true });
    }
    var nextM = viewM === 11 ? 0 : viewM + 1;
    var nextY = viewM === 11 ? viewY + 1 : viewY;
    var nd = 1;
    while (cells.length < 42) {
      cells.push({ y: nextY, m: nextM, d: nd++, inMonth: false });
    }
    return cells;
  }

  // Decide which in-month cell should be tabbable (roving tabindex = 0).
  // Priority: previously active cell if still in-month, else selected, else today, else day 1.
  function computeActiveCell(cells) {
    if (activeCell !== null && cells[activeCell] && cells[activeCell].inMonth) {
      return activeCell;
    }
    var firstIn = -1, selIdx = -1, todayIdx = -1;
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      if (!c.inMonth) continue;
      if (firstIn === -1) firstIn = i;
      if (isSelected(c.y, c.m, c.d)) selIdx = i;
      if (isToday(c.y, c.m, c.d)) todayIdx = i;
    }
    if (selIdx !== -1) return selIdx;
    if (todayIdx !== -1) return todayIdx;
    return firstIn;
  }

  function renderGrid() {
    el.grid.innerHTML = "";
    var cells = buildCells();
    activeCell = computeActiveCell(cells);

    cells.forEach(function (c, idx) {
      var cell = document.createElement("div");
      cell.className = "dp-cell";
      cell.setAttribute("role", "gridcell");

      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = c.d;
      btn.dataset.idx = idx;

      if (c.inMonth) {
        btn.className = "dp-day in";
        if (isToday(c.y, c.m, c.d)) btn.classList.add("today");
        if (isSelected(c.y, c.m, c.d)) {
          btn.classList.add("selected");
          btn.setAttribute("aria-selected", "true");
          btn.setAttribute("aria-current", "date");
        } else {
          btn.setAttribute("aria-selected", "false");
        }
        btn.setAttribute("aria-label", MONTHS[c.m] + " " + c.d + ", " + c.y +
          (isToday(c.y, c.m, c.d) ? " (today)" : ""));
        // Roving tabindex: only the active cell is in the tab order.
        btn.tabIndex = (idx === activeCell) ? 0 : -1;
        btn.addEventListener("click", function () {
          activeCell = idx;
          selectDate(c.y, c.m, c.d);
        });
      } else {
        btn.className = "dp-day out";
        btn.disabled = true;
        btn.setAttribute("aria-hidden", "true");
        btn.tabIndex = -1;
      }

      cell.appendChild(btn);
      el.grid.appendChild(cell);
    });
  }

  function focusActiveCell() {
    var node = el.grid.querySelector('.dp-day[data-idx="' + activeCell + '"]');
    if (node) node.focus();
  }

  // Move roving focus by a delta of cells, navigating across months as needed.
  function moveFocus(delta) {
    if (activeCell === null) return;
    var target = activeCell + delta;
    // Stay within in-month range; if we walk off into out-of-month territory,
    // flip the view to the adjacent month and land on the equivalent day.
    var cells = buildCells();
    if (target >= 0 && target < 42 && cells[target] && cells[target].inMonth) {
      activeCell = target;
      // reflect tabindex without full re-render
      el.grid.querySelectorAll(".dp-day.in").forEach(function (n) {
        n.tabIndex = (parseInt(n.dataset.idx, 10) === activeCell) ? 0 : -1;
      });
      focusActiveCell();
      return;
    }
    // Crossed a month boundary: figure out the real target date and re-render there.
    var base = cells[activeCell];
    var dt = new Date(base.y, base.m, base.d);
    dt.setDate(dt.getDate() + delta);
    viewY = dt.getFullYear();
    viewM = dt.getMonth();
    activeCell = null;
    renderHeader();
    // locate the in-month cell matching the landed date, then pin focus to it
    var all = buildCells();
    for (var i = 0; i < all.length; i++) {
      if (all[i].inMonth && all[i].y === dt.getFullYear() &&
          all[i].m === dt.getMonth() && all[i].d === dt.getDate()) {
        activeCell = i; break;
      }
    }
    renderGrid();
    focusActiveCell();
  }

  function renderFooter() {
    el.selInfo.innerHTML = "";
    var hasSel = selY !== null;
    if (hasSel) {
      var label = document.createElement("span");
      label.className = "dp-sel-label";
      label.textContent = "Selected";
      var value = document.createElement("span");
      value.className = "dp-sel-value";
      value.textContent = selY + "/" + pad(selM + 1) + "/" + pad(selD);
      el.selInfo.appendChild(label);
      el.selInfo.appendChild(value);
    } else {
      var empty = document.createElement("span");
      empty.className = "dp-sel-empty";
      empty.textContent = "Please select a date";
      el.selInfo.appendChild(empty);
    }
    el.clearBtn.disabled = !hasSel;
    el.confirmBtn.disabled = !hasSel;
  }

  function renderAll() {
    renderHeader();
    renderGrid();
    renderFooter();
  }

  function selectDate(y, m, d) {
    selY = y; selM = m; selD = d;
    // reset confirm feedback if a new pick is made
    if (confirmTimer) { clearTimeout(confirmTimer); confirmTimer = null; el.confirmBtn.textContent = "Confirm"; }
    renderGrid();
    renderFooter();
  }

  /* ---------- Popovers ---------- */
  var lastTrigger = null;

  function closePops(restoreFocus) {
    var wasOpen = el.yearPop.classList.contains("open") || el.monthPop.classList.contains("open");
    el.yearPop.classList.remove("open");
    el.monthPop.classList.remove("open");
    el.yearBtn.setAttribute("aria-expanded", "false");
    el.monthBtn.setAttribute("aria-expanded", "false");
    if (wasOpen && restoreFocus && lastTrigger) lastTrigger.focus();
    lastTrigger = null;
  }

  function buildYearGrid() {
    el.yearGrid.innerHTML = "";
    // 12 years, current view year balanced near the centre (5 before, 6 after).
    var start = viewY - 5;
    for (var i = 0; i < 12; i++) {
      (function (yr) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "dp-pop-item" + (yr === viewY ? " active" : "");
        b.textContent = yr;
        if (yr === viewY) b.setAttribute("aria-current", "true");
        b.addEventListener("click", function () {
          viewY = yr;
          activeCell = null;
          closePops(false);
          renderAll();
          el.yearBtn.focus();
        });
        el.yearGrid.appendChild(b);
      })(start + i);
    }
  }

  function buildMonthGrid() {
    el.monthGrid.innerHTML = "";
    MONTHS.forEach(function (name, idx) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "dp-pop-item" + (idx === viewM ? " active" : "");
      b.textContent = name; // full month name for fidelity consistency
      b.setAttribute("aria-label", name);
      if (idx === viewM) b.setAttribute("aria-current", "true");
      b.addEventListener("click", function () {
        viewM = idx;
        activeCell = null;
        closePops(false);
        renderAll();
        el.monthBtn.focus();
      });
      el.monthGrid.appendChild(b);
    });
  }

  function openYearPop() {
    closePops(false);
    buildYearGrid();
    el.yearPop.classList.add("open");
    el.yearBtn.setAttribute("aria-expanded", "true");
    lastTrigger = el.yearBtn;
    var active = el.yearGrid.querySelector(".dp-pop-item.active") || el.yearGrid.firstChild;
    if (active) active.focus();
  }
  function openMonthPop() {
    closePops(false);
    buildMonthGrid();
    el.monthPop.classList.add("open");
    el.monthBtn.setAttribute("aria-expanded", "true");
    lastTrigger = el.monthBtn;
    var active = el.monthGrid.querySelector(".dp-pop-item.active") || el.monthGrid.firstChild;
    if (active) active.focus();
  }

  /* ---------- Navigation handlers ---------- */
  document.getElementById("prevYear").addEventListener("click", function () {
    viewY -= 1; activeCell = null; closePops(false); renderAll();
  });
  document.getElementById("nextYear").addEventListener("click", function () {
    viewY += 1; activeCell = null; closePops(false); renderAll();
  });
  document.getElementById("prevMonth").addEventListener("click", function () {
    if (viewM === 0) { viewM = 11; viewY -= 1; } else { viewM -= 1; }
    activeCell = null; closePops(false); renderAll();
  });
  document.getElementById("nextMonth").addEventListener("click", function () {
    if (viewM === 11) { viewM = 0; viewY += 1; } else { viewM += 1; }
    activeCell = null; closePops(false); renderAll();
  });

  document.getElementById("todayBtn").addEventListener("click", function () {
    viewY = todayY; viewM = todayM; activeCell = null; closePops(false); renderAll();
    selectDate(todayY, todayM, todayD);
  });

  el.yearBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (el.yearPop.classList.contains("open")) { closePops(true); }
    else { openYearPop(); }
  });
  el.monthBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (el.monthPop.classList.contains("open")) { closePops(true); }
    else { openMonthPop(); }
  });

  el.clearBtn.addEventListener("click", function () {
    if (el.clearBtn.disabled) return;
    selY = selM = selD = null;
    renderGrid();
    renderFooter();
    el.confirmBtn.textContent = "Confirm";
    if (confirmTimer) { clearTimeout(confirmTimer); confirmTimer = null; }
  });

  el.confirmBtn.addEventListener("click", function () {
    if (el.confirmBtn.disabled) return;
    var v = (document.querySelector(".dp-sel-value") || {}).textContent;
    var ft = document.getElementById("dateInputText");
    if (v && ft) { ft.textContent = v.trim(); ft.classList.add("filled"); }
    var ov = document.getElementById("dpOverlay");
    if (ov) ov.classList.remove("open");
    closePops(false);
  });

  document.querySelector(".dp-close").addEventListener("click", function () {
    closePops(false);
    var ov = document.getElementById("dpOverlay");
    if (ov) ov.classList.remove("open");
  });

  /* ---------- Keyboard: roving grid navigation ---------- */
  el.grid.addEventListener("keydown", function (e) {
    var k = e.key;
    var handled = true;
    switch (k) {
      case "ArrowLeft":  moveFocus(-1); break;
      case "ArrowRight": moveFocus(1);  break;
      case "ArrowUp":    moveFocus(-7); break;
      case "ArrowDown":  moveFocus(7);  break;
      case "Home": {
        // start of current week row
        var col = activeCell % 7;
        moveFocus(-col);
        break;
      }
      case "End": {
        var col2 = activeCell % 7;
        moveFocus(6 - col2);
        break;
      }
      case "PageUp": {
        // previous month, same column position preserved by recompute
        if (viewM === 0) { viewM = 11; viewY -= 1; } else { viewM -= 1; }
        activeCell = null; renderAll();
        focusActiveCell();
        break;
      }
      case "PageDown": {
        if (viewM === 11) { viewM = 0; viewY += 1; } else { viewM += 1; }
        activeCell = null; renderAll();
        focusActiveCell();
        break;
      }
      case "Enter":
      case " ": {
        var cells = buildCells();
        var c = cells[activeCell];
        if (c && c.inMonth) selectDate(c.y, c.m, c.d);
        focusActiveCell();
        break;
      }
      default: handled = false;
    }
    if (handled) e.preventDefault();
  });

  /* ---------- Popover keyboard: arrow roaming + Home/End ---------- */
  function popKeyHandler(gridEl, cols) {
    return function (e) {
      var items = Array.prototype.slice.call(gridEl.querySelectorAll(".dp-pop-item"));
      var idx = items.indexOf(document.activeElement);
      if (idx === -1) return;
      var next = idx, handled = true;
      switch (e.key) {
        case "ArrowLeft":  next = Math.max(0, idx - 1); break;
        case "ArrowRight": next = Math.min(items.length - 1, idx + 1); break;
        case "ArrowUp":    next = Math.max(0, idx - cols); break;
        case "ArrowDown":  next = Math.min(items.length - 1, idx + cols); break;
        case "Home":       next = 0; break;
        case "End":        next = items.length - 1; break;
        default: handled = false;
      }
      if (handled) { e.preventDefault(); items[next].focus(); }
    };
  }
  el.yearGrid.addEventListener("keydown", popKeyHandler(el.yearGrid, 3));
  el.monthGrid.addEventListener("keydown", popKeyHandler(el.monthGrid, 3));

  // Close popovers when clicking elsewhere
  document.addEventListener("click", function (e) {
    if (!el.yearPop.contains(e.target) && !el.monthPop.contains(e.target) &&
        e.target.id !== "yearBtn" && e.target.id !== "monthBtn" &&
        !e.target.closest("#yearBtn") && !e.target.closest("#monthBtn")) {
      closePops(false);
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closePops(true);
  });

  renderAll();
})();

/* ===========================================================
   Modal flow: the "Booking date" field opens the calendar in a
   dimmed overlay; Confirm fills the field and closes; X / backdrop
   / Esc cancel. The field updates ONLY on Confirm.
   =========================================================== */
(function () {
  "use strict";
  var input = document.getElementById("dateInput");
  var overlay = document.getElementById("dpOverlay");
  if (!input || !overlay) return;
  function close() { overlay.classList.remove("open"); }
  input.addEventListener("click", function () { overlay.classList.add("open"); });
  overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
})();
</script>
</body>
</html>
